name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Repo root = app folder contents: pom.xml sits at the repository root,
      # so the build runs directly at the root (no working-directory override).
      - name: Build jar
        run: mvn -B -DskipTests package --file pom.xml

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketsoftware-jar
          path: target/pocketsoftware.jar

      - name: Publish GitHub release with jar
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" target/pocketsoftware.jar \
            --title "PocketSoftware ${{ github.ref_name }}" \
            --notes "Automated release of the PocketSoftware school engine (target/pocketsoftware.jar, built from commit ${{ github.sha }})."
