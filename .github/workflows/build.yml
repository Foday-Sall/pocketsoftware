name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build jar
        run: mvn -B -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketsoftware-jar
          path: target/pocketsoftware.jar

      - name: Publish jar to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/pocketsoftware.jar \
            --title "PocketSoftware $GITHUB_REF_NAME" \
            --notes "Automated jar build from $GITHUB_SHA. Runs on any Java 25+ runtime (java -jar pocketsoftware.jar)."
